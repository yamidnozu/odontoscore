<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgIo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="bodyIo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <radialGradient id="ringIo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </radialGradient>
  </defs>
  <rect width="600" height="600" rx="24" fill="url(#bgIo)"/>
  <!-- Base Stand -->
  <ellipse cx="300" cy="510" rx="90" ry="24" fill="#CBD5E1"/>
  <ellipse cx="300" cy="505" rx="75" ry="18" fill="#E2E8F0"/>
  <!-- Toothbrush Body -->
  <rect x="270" y="240" width="60" height="260" rx="28" fill="url(#bodyIo)"/>
  <!-- Smart Pressure Ring -->
  <rect x="270" y="235" width="60" height="12" rx="4" fill="url(#ringIo)"/>
  <!-- OLED Display -->
  <rect x="282" y="280" width="36" height="70" rx="10" fill="#020617"/>
  <circle cx="300" cy="305" r="8" fill="#38BDF8"/>
  <text x="300" y="335" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#F8FAFC" text-anchor="middle">2:00</text>
  <!-- Power Button -->
  <circle cx="300" cy="380" r="10" fill="#475569" stroke="#94A3B8" stroke-width="2"/>
  <!-- Metal Shaft -->
  <rect x="296" y="170" width="8" height="65" fill="#E2E8F0"/>
  <!-- Brush Head -->
  <rect x="292" y="110" width="16" height="70" rx="8" fill="#FFFFFF"/>
  <circle cx="300" cy="115" r="22" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <circle cx="300" cy="115" r="14" fill="#0EA5E9"/>
  <circle cx="300" cy="115" r="6" fill="#0284C7"/>
  <!-- Badges -->
  <rect x="40" y="40" width="160" height="36" rx="18" fill="#0E76BC"/>
  <text x="120" y="63" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Oral-B iO Series 9</text>
  <rect x="40" y="85" width="140" height="28" rx="14" fill="#E0F2FE"/>
  <text x="110" y="104" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#0369A1" text-anchor="middle">Motor Magnético</text>
</svg>
