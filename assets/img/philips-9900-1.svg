<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5FF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="bodyPh" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" rx="24" fill="url(#bgPh)"/>
  <!-- Minimalist Sonicare Handle -->
  <rect x="275" y="220" width="50" height="280" rx="25" fill="url(#bodyPh)" stroke="#CBD5E1" stroke-width="2"/>
  <!-- Champagne Accent Ring -->
  <rect x="275" y="215" width="50" height="8" rx="2" fill="url(#goldAcc)"/>
  <!-- Seamless Touch Area -->
  <circle cx="300" cy="310" r="8" fill="#CBD5E1"/>
  <circle cx="300" cy="380" r="4" fill="#0EA5E9"/>
  <circle cx="300" cy="400" r="4" fill="#0EA5E9"/>
  <circle cx="300" cy="420" r="4" fill="#0EA5E9"/>
  <text x="300" y="470" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#94A3B8" text-anchor="middle">SenseIQ</text>
  <!-- Metal Shaft -->
  <rect x="297" y="160" width="6" height="60" fill="#E2E8F0"/>
  <!-- Sonic Head -->
  <rect x="290" y="100" width="20" height="70" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <path d="M294 100 L306 100 L306 135 L294 135 Z" fill="#0284C7"/>
  <!-- Badges -->
  <rect x="40" y="40" width="240" height="36" rx="18" fill="#0E76BC"/>
  <text x="160" y="63" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Philips Sonicare 9900</text>
  <rect x="40" y="85" width="160" height="28" rx="14" fill="#FEF3C7"/>
  <text x="120" y="104" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">62.000 mov/min Sónico</text>
</svg>
