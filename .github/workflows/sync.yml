name: OdontoScore Sync & Deploy Pipeline

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *' # Cada 6 horas automáticamente
  workflow_dispatch:      # Ejecución manual bajo demanda

jobs:
  sync-build-deploy:
    name: Compilar y Desplegar OdontoScore
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FTP_PASS: ${{ secrets.FTP_PASS }}
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔄 Sincronizar Precios y Stock desde Amazon PA-API / Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          AMAZON_ACCESS_KEY: ${{ secrets.AMAZON_ACCESS_KEY }}
          AMAZON_SECRET_KEY: ${{ secrets.AMAZON_SECRET_KEY }}
          AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
          AMAZON_HOST: ${{ secrets.AMAZON_HOST }}
          AMAZON_REGION: ${{ secrets.AMAZON_REGION }}
          RAINFOREST_API_KEY: ${{ secrets.RAINFOREST_API_KEY }}
        run: |
          python tools/sync_supabase.py --force || true

      - name: ⚙️ Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar dependencias Node y Astro
        run: npm ci

      - name: 🏗️ Compilar Sitio Estático con Astro + React (dist/)
        run: npm run build

      - name: 💾 Guardar cambios de catálogo y caché en el repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add datos/productos.json lib/db.js sitemap.xml public/sitemap.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(sync): auto-actualización catálogo y precios [skip ci]" && git push origin main)

      - name: 🚀 Desplegar a Hostinger vía FTP
        if: env.FTP_PASS != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 'ftp.odontoscore.com'
          username: 'u358159530'
          password: ${{ env.FTP_PASS }}
          local-dir: './dist/'
          server-dir: 'public_html/'
