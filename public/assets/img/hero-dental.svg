<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E76BC"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="32" fill="url(#heroGrad)"/>
  <!-- Decorative Circles -->
  <circle cx="700" cy="100" r="180" fill="#38BDF8" opacity="0.15"/>
  <circle cx="100" cy="400" r="140" fill="#0284C7" opacity="0.25"/>
  <!-- Floating Clinical Tech Cards -->
  <rect x="80" y="80" width="300" height="150" rx="20" fill="url(#cardGrad)" opacity="0.95"/>
  <text x="110" y="125" font-family="Sora, sans-serif" font-size="18" font-weight="800" fill="#0F172A">Evaluación 7 Ejes</text>
  <text x="110" y="155" font-family="Inter, sans-serif" font-size="12" fill="#64748B">Eficacia · Encías · Silencio · Durabilidad</text>
  <rect x="110" y="175" width="220" height="12" rx="6" fill="#E2E8F0"/>
  <rect x="110" y="175" width="190" height="12" rx="6" fill="#10B981"/>
  
  <rect x="420" y="140" width="300" height="160" rx="20" fill="url(#cardGrad)" opacity="0.95"/>
  <text x="450" y="185" font-family="Sora, sans-serif" font-size="18" font-weight="800" fill="#0F172A">Comparador Clínico</text>
  <text x="450" y="215" font-family="Inter, sans-serif" font-size="12" fill="#64748B">Tecnología Sónica vs Rotatoria vs Irrigador</text>
  <rect x="450" y="235" width="220" height="30" rx="8" fill="#E0F2FE"/>
  <text x="560" y="255" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#0369A1" text-anchor="middle">Pruebas Normalizadas 2026</text>

  <rect x="250" y="270" width="320" height="160" rx="20" fill="url(#cardGrad)" opacity="0.95"/>
  <text x="280" y="315" font-family="Sora, sans-serif" font-size="18" font-weight="800" fill="#0E76BC">Aval E-E-A-T y ADA</text>
  <text x="280" y="345" font-family="Inter, sans-serif" font-size="12" fill="#334155">Datos técnicos verificados en fabricantes oficiales</text>
  <rect x="280" y="365" width="110" height="26" rx="13" fill="#DCFCE7"/>
  <text x="335" y="382" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#15803D" text-anchor="middle">100% Sin Sesgo</text>
</svg>
